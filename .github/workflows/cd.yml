name: CD

# develop에 push될 때 (= PR이 develop에 머지될 때) 실행
# workflow_dispatch: Actions 탭에서 버튼으로 수동 실행도 가능
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  # ── Job 1: jar 빌드 → Docker 이미지 생성 → Docker Hub 업로드 ──
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 실행 가능한 jar 생성 → build/libs/be-0.0.1-SNAPSHOT.jar
      - name: Build jar
        run: ./gradlew clean bootJar

      # Phase 6에서 등록한 Secrets로 Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 이미지 태그 = 커밋 해시 → 어떤 커밋이 배포됐는지 추적 가능
      - name: Build & Push Docker image
        run: |
          docker build -t ${{ vars.DOCKER_IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ vars.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  # ── Job 2: EC2에 SSH 접속 → 새 이미지로 컨테이너 교체 ──
  deploy:
    needs: build-and-push   # Job 1이 성공해야만 실행
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ vars.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            CONTAINER=nemosdream-be

            # 1. 새 이미지 다운로드
            docker pull $IMAGE

            # 2. 기존 컨테이너 종료/삭제 (처음엔 없으니 에러 무시)
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true

            # 3. 새 컨테이너 실행
            #    -p 8080:8080 : EC2 8080 → 컨테이너 8080 (Nginx가 여기로 넘겨줌)
            #    --restart unless-stopped : 서버 재부팅돼도 자동 재시작
            docker run -d --name $CONTAINER -p 8080:8080 --restart unless-stopped $IMAGE

            # 4. 안 쓰는 이미지 정리 (EC2 디스크 꽉 차는 것 방지)
            docker image prune -af

            # 5. 헬스체크: 최대 50초 동안 /health 응답 확인
            for i in $(seq 1 10); do
              if curl -fs http://localhost:8080/health > /dev/null; then
                echo "배포 성공"
                exit 0
              fi
              sleep 5
            done
            echo "헬스체크 실패, 최근 로그:"
            docker logs --tail 50 $CONTAINER
            exit 1
