name: CI

# develop 또는 main으로 향하는 PR이 열리거나, PR에 커밋이 추가될 때 실행
on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub가 빌려주는 임시 우분투 컴퓨터 (Runner)

    steps:
      # 1. 레포 코드를 Runner로 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 21 설치 + Gradle 의존성 캐시
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드 + 테스트 (실패하면 PR에 빨간 X)
      - name: Build & Test
        run: ./gradlew clean build
