spring:
  application:
    name: be
  # 값은 환경변수로 덮어쓴다 (EC2: DB_URL, DB_USERNAME, DB_PASSWORD). 기본값 = 로컬 docker-compose DB.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kmoneyball}
    username: ${DB_USERNAME:kmb}
    password: ${DB_PASSWORD:kmb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # 테이블은 etl/schema/*.sql 로 만든다. JPA 가 건드리지 않게.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        # 시작할 때 DB 에 접속하지 않는다. DB 가 없어도 서버는 뜨고(/health OK) 쿼리할 때만 실패한다.
        # CI(DB 없음)와, EC2 에 아직 DB 가 없는 동안의 CD 배포가 깨지지 않게 하기 위함.
        boot.allow_jdbc_metadata_access: false
  jackson:
    # 명세의 JSON 키가 전부 snake_case (game_id, start_inning ...). 자바 필드는 camelCase 로 쓴다.
    property-naming-strategy: SNAKE_CASE

server:
  # EC2 에서 Nginx(HTTPS) 뒤에 있을 때 원래 주소(https://도메인)를 알아내기 위함.
  # 없으면 Swagger 의 "Try it out" 이 http:// 로 요청해서 막힌다.
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html          # → /swagger-ui/index.html 로 이동
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins:
      - https://nemosdream.vercel.app
      - http://localhost:5173
      - http://localhost:3000

  # GET /config 응답. LI 는 리그 평균 = 1.0 으로 정규화된 값 (li_baseline.json).
  # max(LI_max) 와 밴드 경계는 추후 논의필요 — 확정되면 여기만 고쳐야 함.
  client-config:
    leverage:
      league-avg: 1.0
      max: 5.0
      bands:
        - { label: "저", min: 0.0, max: 0.85 }
        - { label: "중", min: 0.85, max: 1.5 }
        - { label: "고", min: 1.5, max: 3.0 }
        - { label: "매우 높음", min: 3.0, max: 5.0 }
    model:
      score-unit: wpa_per_pa
      description: "Contextual Bandit 예상 성과. 투수 관점, 높을수록 좋음"
      provisional: true       # 밴딧(B1) 점수가 들어오면 false
    li-source-note: "상황 중요도. 문형우 외(2016) 승리확률 테이블 기반"

  # 교체 후보의 matchup_vs_batter (명세 §2-2) 판정 기준. 투수 관점.
  # 상대 wOBA(좌우 기준값으로 보정된 값)가 리그 평균보다 margin 이상 낮으면 favorable, 높으면 unfavorable.
  # 임시값 — 기준은 회의 안건(명세 §9 #7). 2025 조합 기준 favorable 32% / neutral 44% / unfavorable 24%.
  matchup:
    league-woba: 0.2924     # handedness_baseline.json 의 _GLOBAL wOBA
    margin: 0.015

  # 타석 결과 주사위 (log5). CatBoost(Flask /predict-pa)가 준비되면 그쪽으로 바꾸고 log5 는 예비용으로 남긴다.
  simulation:
    log5-k: 200             # 선수 비율을 리그 쪽으로 당기는 가상 타석 수. 2025 검증 log loss 최소 (etl/10_outcome_counts.py)
    league-season: "2024"   # league_outcome_rates 기준 시즌

  # 시뮬레이션 세션 (서버 메모리). 마지막 요청 후 ttl 이 지나면 만료 → SESSION_EXPIRED (명세 §3-4)
  session:
    ttl: 30m
